<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest">
  <title>FFmpeg Video Toolkit Pro</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1F4B"/>
      <stop offset="1" stop-color="#0A0D24"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#C026D3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="left">
      <polygon points="846,72 0,72 0,1018 274,1018"/>
    </clipPath>
    <clipPath id="right">
      <polygon points="274,1018 846,72 1024,72 1024,1018"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <g id="play">
      <polygon points="380,290 380,734 770,512" fill="url(#fg)" stroke="url(#fg)" stroke-width="40" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- Background tile -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#glow)"/>
  <rect x="68" y="68" width="888" height="888" rx="204" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>

  <!-- Play triangle sliced by a diagonal cut -->
  <g filter="url(#shadow)">
    <g clip-path="url(#left)" transform="translate(-14,-8)"><use href="#play"/></g>
    <g clip-path="url(#right)" transform="translate(14,8)"><use href="#play"/></g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
