name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-engine:
    name: Engine Tests (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fallback FFmpeg install (if not in PATH)
        shell: bash
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            echo "[CI] AnimMouse setup-ffmpeg not found, running OS package manager fallback..."
            if [ "$RUNNER_OS" == "Linux" ]; then
              sudo apt-get update && sudo apt-get install -y ffmpeg
            elif [ "$RUNNER_OS" == "macOS" ]; then
              brew install ffmpeg
            elif [ "$RUNNER_OS" == "Windows" ]; then
              choco install ffmpeg --no-progress --force
            fi
          fi

      - name: Verify FFmpeg availability
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Run Engine Test Suite (Unit & Integration)
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s engine/tests -v

  audit-skill:
    name: Agensi Skill Audit & Package Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Static Security Audit
        run: |
          python scripts/audit_self.py

      - name: Build and Verify Skill Zip
        run: |
          python scripts/build_skill_zip.py

      - name: Verify Zip Artifact Integrity
        run: |
          test -f dist/ffmpeg-video-toolkit-pro-skill-v1.0.0.zip
          unzip -t dist/ffmpeg-video-toolkit-pro-skill-v1.0.0.zip

  test-frontend:
    name: Desktop Frontend Tests & Static Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Install Dependencies
        run: |
          pnpm --dir desktop install
          pnpm --dir desktop approve-builds --all

      - name: Run Vitest Suite
        run: |
          pnpm --dir desktop test

      - name: Build Static Nuxt Distribution
        run: |
          pnpm --dir desktop generate

      - name: Verify Generated Public Bundle
        run: |
          test -f desktop/.output/public/index.html
          test -f desktop/.output/public/200.html

  test-tauri-backend:
    name: Desktop Tauri Backend Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Run Tauri Backend Unit Tests
        env:
          RUST_BACKTRACE: 1
        run: |
          cargo test --lib --manifest-path desktop/src-tauri/Cargo.toml --verbose
