name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-engine:
    name: Engine Tests (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: '3.9'
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.11'
          - os: macos-latest
            python-version: '3.11'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress
          $paths = @("C:\ProgramData\chocolatey\bin", "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin")
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Add-Content -Path $env:GITHUB_PATH -Value $p
            }
          }

      - name: Verify FFmpeg availability
        shell: bash
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Run Engine Test Suite (Unit & Integration)
        shell: bash
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python -m unittest discover -s engine/tests -v 2>&1 | tee test_results.log

      - name: Publish Test Summary
        if: always()
        shell: bash
        run: |
          if [ -f test_results.log ]; then
            echo "### Engine Test Results (${{ matrix.os }} - Py ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 test_results.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Dump Full Test Failure Log
        if: failure()
        shell: bash
        run: |
          if [ -f test_results.log ]; then
            echo "===== FULL TEST LOG ON FAILURE ====="
            cat test_results.log
            python scripts/emit_failure_annotation.py
          fi

      - name: Upload Test Logs Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-log-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test_results.log

  audit-skill:
    name: Agensi Skill Audit & Package Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Static Security Audit
        run: |
          python scripts/audit_self.py

      - name: Build and Verify Skill Zip
        run: |
          python scripts/build_skill_zip.py

      - name: Verify Zip Artifact Integrity
        run: |
          test -f dist/ffmpeg-video-toolkit-pro-skill-v1.0.0.zip
          unzip -t dist/ffmpeg-video-toolkit-pro-skill-v1.0.0.zip

  test-frontend:
    name: Desktop Frontend Tests & Static Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Install Dependencies
        run: |
          pnpm --dir desktop install
          pnpm --dir desktop approve-builds --all

      - name: Run Vitest Suite
        run: |
          pnpm --dir desktop test

      - name: Build Static Nuxt Distribution
        run: |
          pnpm --dir desktop generate

      - name: Verify Generated Public Bundle
        run: |
          test -f desktop/.output/public/index.html
          test -f desktop/.output/public/200.html

  test-tauri-backend:
    name: Desktop Tauri Backend Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Run Tauri Backend Unit Tests
        shell: bash
        env:
          RUST_BACKTRACE: 1
        run: |
          set -o pipefail
          cargo test --lib --manifest-path desktop/src-tauri/Cargo.toml --verbose 2>&1 | tee tauri_test_results.log

      - name: Publish Tauri Test Summary
        if: always()
        shell: bash
        run: |
          if [ -f tauri_test_results.log ]; then
            echo "### Tauri Backend Test Results (${{ matrix.os }})" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 tauri_test_results.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Dump Full Tauri Test Failure Log
        if: failure()
        shell: bash
        run: |
          if [ -f tauri_test_results.log ]; then
            echo "===== FULL TAURI TEST LOG ON FAILURE ====="
            cat tauri_test_results.log
          fi

      - name: Upload Tauri Test Logs Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-test-log-${{ matrix.os }}
          path: tauri_test_results.log
