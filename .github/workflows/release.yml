name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build-skill-package:
    name: Build Skill Package
    runs-on: ubuntu-latest
    outputs:
      zip_path: ${{ steps.build_zip.outputs.zip_path }}
      zip_hash: ${{ steps.build_zip.outputs.zip_hash }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit & Build Skill Zip
        id: build_zip
        run: |
          python scripts/audit_self.py
          python scripts/build_skill_zip.py
          ZIP_NAME=$(ls dist/*.zip)
          HASH=$(sha256sum "$ZIP_NAME" | awk '{print $1}')
          echo "zip_path=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Upload Skill Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agensi-skill-package
          path: dist/*.zip

  build-desktop-binaries:
    name: Build Desktop App (${{ matrix.platform }})
    needs: build-skill-package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-x64'
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: 'macos-universal'
            os: macos-latest
            target: universal-apple-darwin
          - platform: 'linux-x64'
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress
          $paths = @("C:\ProgramData\chocolatey\bin", "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin")
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Add-Content -Path $env:GITHUB_PATH -Value $p
            }
          }

      - name: Stage Pinned FFmpeg & FFprobe Binaries
        shell: bash
        run: |
          python scripts/fetch_ffmpeg.py --target ${{ matrix.target }}

      - name: Build Engine Sidecar Binary
        shell: bash
        run: |
          python -m pip install --upgrade pyinstaller
          python scripts/build_engine_sidecar.py --target ${{ matrix.target }}

      - name: Install Frontend Dependencies & Build Static SPA
        run: |
          pnpm --dir desktop install
          pnpm --dir desktop approve-builds --all
          pnpm --dir desktop generate

      - name: Configure macOS Code Signing (Optional)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_SECRET != ''
        env:
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE_SECRET" >> $GITHUB_ENV
          echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD_SECRET" >> $GITHUB_ENV
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_SECRET" >> $GITHUB_ENV
          echo "APPLE_ID=$APPLE_ID_SECRET" >> $GITHUB_ENV
          echo "APPLE_PASSWORD=$APPLE_PASSWORD_SECRET" >> $GITHUB_ENV
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET" >> $GITHUB_ENV

      - name: Build Tauri Application Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ env.RELEASE_VERSION }}
          releaseName: "FFmpeg Video Toolkit Pro ${{ env.RELEASE_VERSION }}"
          releaseBody: "Commercial release build for ${{ env.RELEASE_VERSION }}. Includes native standalone desktop installers for Windows (.exe / .msi), macOS Universal Apple Silicon & Intel (.dmg), and Linux (.AppImage / .deb), plus the Agensi AI Agent Skill package."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  create-checksums:
    name: Generate Release Checksums & Finalize
    needs: [build-skill-package, build-desktop-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Skill Artifact
        uses: actions/download-artifact@v4
        with:
          name: agensi-skill-package
          path: release-artifacts/

      - name: Generate Checksums Manifest
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt || true
          cat SHA256SUMS.txt || true

      - name: Upload Checksums to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ env.RELEASE_VERSION }}" release-artifacts/* --clobber
