name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build-skill-package:
    name: Build Skill Package
    runs-on: ubuntu-latest
    outputs:
      zip_path: ${{ steps.build_zip.outputs.zip_path }}
      zip_hash: ${{ steps.build_zip.outputs.zip_hash }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit & Build Skill Zip
        id: build_zip
        run: |
          python scripts/audit_self.py
          python scripts/build_skill_zip.py
          ZIP_NAME=$(ls dist/*.zip)
          HASH=$(sha256sum "$ZIP_NAME" | awk '{print $1}')
          echo "zip_path=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Upload Skill Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agensi-skill-package
          path: dist/*.zip

  build-desktop-binaries:
    name: Build Desktop App (${{ matrix.platform }})
    needs: build-skill-package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-x64'
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: 'macos-arm64'
            os: macos-latest
            target: aarch64-apple-darwin
          - platform: 'linux-x64'
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Set up FFmpeg (Full GPL static build)
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Stage Pinned FFmpeg & FFprobe Binaries
        shell: pwsh
        run: |
          python scripts/fetch_ffmpeg.py

      - name: Build Engine Sidecar Binary
        shell: pwsh
        run: |
          pip install pyinstaller
          python scripts/build_engine_sidecar.py

      - name: Install Frontend Dependencies & Build Static SPA
        run: |
          pnpm --dir desktop install
          pnpm --dir desktop approve-builds --all
          pnpm --dir desktop generate

      - name: Build Tauri Application Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional Code Signing Secrets (Skipped cleanly if empty)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          tagName: ${{ env.RELEASE_VERSION }}
          releaseName: "FFmpeg Video Toolkit Pro ${{ env.RELEASE_VERSION }}"
          releaseBody: "Commercial release build for ${{ env.RELEASE_VERSION }}. Includes native standalone desktop installers for Windows (.exe / .msi), macOS (.dmg), and Linux (.AppImage / .deb), plus the Agensi AI Agent Skill package."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  create-checksums:
    name: Generate Release Checksums & Finalize
    needs: [build-skill-package, build-desktop-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Skill Artifact
        uses: actions/download-artifact@v4
        with:
          name: agensi-skill-package
          path: release-artifacts/

      - name: Generate Checksums Manifest
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt || true
          cat SHA256SUMS.txt || true

      - name: Upload Checksums to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          files: |
            release-artifacts/*
